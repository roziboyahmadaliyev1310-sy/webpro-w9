<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>About</title>
    <style>
      :root {
        color-scheme: light;
        font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        color: #172554;
        background: #eff6ff;
      }

      * {
        box-sizing: border-box;
      }

      body {
        min-height: 100vh;
        margin: 0;
        display: grid;
        place-items: center;
        padding: 2rem;
        background:
          radial-gradient(circle at 15% 15%, #bfdbfe 0, transparent 30%),
          radial-gradient(circle at 85% 85%, #ddd6fe 0, transparent 28%),
          #eff6ff;
      }

      main {
        width: min(100%, 680px);
        padding: clamp(2rem, 7vw, 4rem);
        border: 1px solid #dbeafe;
        border-radius: 24px;
        background: rgb(255 255 255 / 90%);
        box-shadow: 0 24px 60px rgb(30 64 175 / 12%);
      }

      .eyebrow {
        margin: 0 0 1rem;
        color: #2563eb;
        font-size: 0.8rem;
        font-weight: 700;
        letter-spacing: 0.16em;
        text-transform: uppercase;
      }

      h1 {
        margin: 0;
        font-size: clamp(2rem, 6vw, 3.5rem);
        line-height: 1.15;
        letter-spacing: -0.04em;
      }

      .accent {
        color: #2563eb;
      }

      .date {
        display: inline-block;
        margin: 1.75rem 0 0;
        padding: 0.55rem 0.9rem;
        border-radius: 999px;
        background: #dbeafe;
        color: #1d4ed8;
        font-size: 0.9rem;
        font-weight: 600;
      }
    </style>
  </head>
  <body>
    <main>
      <p class="eyebrow">A little about me</p>
      <h1>My name is <span class="accent">Ruziboy</span>. And i am a student at Gachon university</h1>
      <p class="date">November 6, 2026</p>
    </main>
  </body>
</html>
